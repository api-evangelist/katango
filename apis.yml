name: Katango
description: 'Katango was a Palo Alto, California mobile software startup whose smartphone app
  automatically organized a user''s phone and social contacts into intelligent groups (circles) using
  clustering algorithms, so people could share and message the right subset of friends without manually
  building lists. The company was backed by Kleiner Perkins Caufield & Byers (through its sFund social
  initiative) and was acquired by Google in November 2011, with the team joining Google to work on the
  Google+ Circles experience. The standalone product was discontinued after the acquisition. This
  API Evangelist profile was created as a Kleiner Perkins portfolio lead; enrichment confirms the
  company is defunct with no public developer surface, API, or documentation. The katango.com domain now
  resolves to Google-owned infrastructure with no live site.'
